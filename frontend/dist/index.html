<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PII Governance & Anonymization Control Plane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      @keyframes spin3dX {
        0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
        100% { transform: rotateX(360deg) rotateY(180deg) rotateZ(360deg); }
      }
      @keyframes spin3dY {
        0% { transform: rotateX(0deg) rotateY(360deg) rotateZ(0deg); }
        100% { transform: rotateX(180deg) rotateY(0deg) rotateZ(360deg); }
      }
      @keyframes pulseCore {
        0%, 100% { transform: scale(0.85); box-shadow: 0 0 20px rgba(0, 242, 254, 0.6), inset 0 0 10px rgba(168, 85, 247, 0.6); }
        50% { transform: scale(1.18); box-shadow: 0 0 40px rgba(0, 242, 254, 0.95), inset 0 0 20px rgba(168, 85, 247, 0.95); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.5; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-v19.js"></script>
  </head>
  <body style="margin: 0; padding: 0; background-color: #060913; color: #f8fafc; font-family: 'Outfit', system-ui, sans-serif;">
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at center, #0f172a 0%, #060913 75%); text-align: center; padding: 20px;">
        <div style="position: relative; width: 120px; height: 120px; perspective: 1000px; transform-style: preserve-3d; margin-bottom: 28px; display: flex; align-items: center; justify-content: center;">
          <!-- Ambient Glow Aura -->
          <div style="position: absolute; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(0,242,254,0.3) 0%, rgba(168,85,247,0.15) 50%, transparent 70%); filter: blur(12px);"></div>
          <!-- 3D Gyro Ring 1 (Outer Cyan) -->
          <div style="position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 3px solid transparent; border-top: 3px solid #00f2fe; border-bottom: 3px solid #00f2fe; box-shadow: 0 0 22px rgba(0, 242, 254, 0.45); animation: spin3dX 3.5s linear infinite;"></div>
          <!-- 3D Gyro Ring 2 (Middle Purple) -->
          <div style="position: absolute; width: 85px; height: 85px; border-radius: 50%; border: 3px solid transparent; border-left: 3px solid #a855f7; border-right: 3px solid #a855f7; box-shadow: 0 0 20px rgba(168, 85, 247, 0.45); animation: spin3dY 2.8s linear infinite;"></div>
          <!-- 3D Gyro Ring 3 (Inner Sky Blue) -->
          <div style="position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 2.5px solid transparent; border-top: 2.5px solid #38bdf8; border-right: 2.5px solid #38bdf8; animation: spin3dX 2s linear infinite reverse;"></div>
          <!-- Quantum Core -->
          <div style="position: absolute; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #00f2fe, #a855f7); animation: pulseCore 2.2s ease-in-out infinite;"></div>
        </div>
        <h3 style="margin: 0 0 8px 0; font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, #ffffff 20%, #38bdf8 65%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.02em;">
          Initializing Governance Engine...
        </h3>
        <p style="margin: 0; font-size: 0.88rem; color: #94a3b8; display: flex; align-items: center; justify-content: center; gap: 8px;">
          <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #00f2fe; box-shadow: 0 0 10px #00f2fe; animation: pulseDot 1.5s ease-in-out infinite;"></span>
          Syncing session state
        </p>
      </div>
    </div>
  </body>
</html>
