<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="550" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold" letter-spacing="1">ZERO-TRUST LLM GUARDRAIL ARCHITECTURE</text>
  <text x="550" y="72" text-anchor="middle" fill="#94a3b8" font-size="13">Hybrid Dual-Tier Engine: Deterministic Fast-Path (<0.5ms) &amp; Neural SLM Zero-Shot (~50ms)</text>

  <!-- Box 1: Inbound Prompt -->
  <rect x="350" y="100" width="400" height="65" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="550" y="128" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">INBOUND CLIENT PROMPT / API REQUEST</text>
  <text x="550" y="148" text-anchor="middle" fill="#cbd5e1" font-size="12">OpenAI SDK / LangChain / v1/chat/completions / Stream</text>

  <!-- Arrow down -->
  <line x1="550" y1="165" x2="550" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="550,200 545,190 555,190" fill="#64748b" />

  <!-- Box 2: Router & Toggle Check -->
  <rect x="320" y="200" width="460" height="75" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
  <text x="550" y="226" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="bold">COMPLIANCE ROUTER &amp; OVERVIEW TOGGLE</text>
  <text x="550" y="246" text-anchor="middle" fill="#94a3b8" font-size="12">HIPAA Safe Harbor (ON/OFF)  |  DPDP Act 2023 (ON/OFF)</text>
  <text x="550" y="263" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Overview Switch: Advanced Filtering (GLiNER SLM)?</text>

  <!-- Branch Left (Fast Path) -->
  <path d="M 420 275 L 420 330 L 250 330 L 250 360" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4" />
  <polygon points="250,365 245,355 255,355" fill="#06b6d4" />
  <rect x="230" y="295" width="180" height="24" rx="5" fill="#083344" stroke="#06b6d4" stroke-width="1" />
  <text x="320" y="311" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">OFF: Fast-Path (&lt;0.5ms)</text>

  <!-- Branch Right (Advanced Filtering) -->
  <path d="M 680 275 L 680 330 L 850 330 L 850 360" fill="none" stroke="#f59e0b" stroke-width="2" />
  <polygon points="850,365 845,355 855,355" fill="#f59e0b" />
  <rect x="690" y="295" width="210" height="24" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
  <text x="795" y="311" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">ON: Neural Active (~50ms)</text>

  <!-- Engine Card 1: Fast Path (Left) -->
  <rect x="50" y="365" width="400" height="210" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
  <rect x="50" y="365" width="400" height="35" rx="12" fill="#083344" />
  <text x="250" y="388" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">TIER 0: DETERMINISTIC FAST-PATH (&lt;0.5ms)</text>
  <text x="75" y="422" fill="#cbd5e1" font-size="12">• Indian Aadhaar (Verhoeff Checksum Check)</text>
  <text x="75" y="444" fill="#cbd5e1" font-size="12">• PAN Card (Income Tax Dept 10-char Syntax)</text>
  <text x="75" y="466" fill="#cbd5e1" font-size="12">• Credit / Debit Cards (Luhn Algorithm Algorithm)</text>
  <text x="75" y="488" fill="#cbd5e1" font-size="12">• UPI ID Handles (@okaxis, @okhdfc, @paytm)</text>
  <text x="75" y="510" fill="#cbd5e1" font-size="12">• US SSN, Medical Record (MRN), Health Plan IDs</text>
  <text x="75" y="532" fill="#cbd5e1" font-size="12">• Indian PIN Codes, Phones (+91), RFC Emails, IP</text>
  <text x="75" y="554" fill="#94a3b8" font-size="11">Throughput: &gt;10,000 req/sec | C-speed Regex</text>

  <!-- Engine Card 2: Neural SLM (Right) -->
  <rect x="650" y="365" width="400" height="210" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
  <rect x="650" y="365" width="400" height="35" rx="12" fill="#451a03" />
  <text x="850" y="388" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">TIER 1: GLiNER 152M NEURAL SLM (~50ms)</text>
  <text x="675" y="422" fill="#fef08a" font-size="12">+ All Tier 0 Deterministic Checksums</text>
  <text x="675" y="444" fill="#cbd5e1" font-size="12">• Bare Human Names (&quot;Rahul Sharma&quot;, &quot;Sarah Connor&quot;)</text>
  <text x="675" y="466" fill="#cbd5e1" font-size="12">• Unanchored Cities (&quot;Kolkata&quot;, &quot;Bangalore&quot;, &quot;Pune&quot;)</text>
  <text x="675" y="488" fill="#cbd5e1" font-size="12">• Unstructured Salary / CTC (&quot;INR 24 LPA&quot;)</text>
  <text x="675" y="510" fill="#cbd5e1" font-size="12">• Hospital Facilities (&quot;Seattle Grace Hospital&quot;)</text>
  <text x="675" y="532" fill="#6ee7b7" font-size="12">• Clinical Protection: 0% False Positives on Drugs</text>
  <text x="675" y="554" fill="#94a3b8" font-size="11">Model: urchade/gliner_small-v2.1 (DeBERTa-v3)</text>

  <!-- Converge down to Deduplication -->
  <path d="M 250 575 L 250 615 L 500 615 L 500 635" fill="none" stroke="#06b6d4" stroke-width="2" />
  <path d="M 850 575 L 850 615 L 600 615 L 600 635" fill="none" stroke="#f59e0b" stroke-width="2" />
  <polygon points="550,640 545,630 555,630" fill="#a855f7" />

  <!-- Box 3: Deduplication & Conflict Resolution -->
  <rect x="300" y="640" width="500" height="55" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
  <text x="550" y="662" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="bold">SPAN DEDUPLICATION &amp; CONFLICT RESOLUTION</text>
  <text x="550" y="681" text-anchor="middle" fill="#cbd5e1" font-size="11">Offset sort • Highest-confidence priority • No double-masking of tokens</text>

  <!-- Arrow down -->
  <line x1="550" y1="695" x2="550" y2="725" stroke="#64748b" stroke-width="2" />
  <polygon points="550,730 545,720 555,720" fill="#64748b" />

  <!-- Box 4: Enforcement & Upstream -->
  <rect x="180" y="730" width="740" height="85" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2" />
  <text x="550" y="755" text-anchor="middle" fill="#34d47a" font-size="14" font-weight="bold">ENFORCEMENT ENGINE &amp; UPSTREAM LLM FORWARDING</text>
  <text x="210" y="780" fill="#cbd5e1" font-size="12"><tspan fill="#38bdf8" font-weight="bold">REDACT:</tspan> Vault token mapping</text>
  <text x="395" y="780" fill="#cbd5e1" font-size="12"><tspan fill="#ef4444" font-weight="bold">BLOCK:</tspan> HTTP 400 rejection</text>
  <text x="555" y="780" fill="#cbd5e1" font-size="12"><tspan fill="#f59e0b" font-weight="bold">HASH:</tspan> HMAC-SHA256</text>
  <text x="705" y="780" fill="#cbd5e1" font-size="12"><tspan fill="#94a3b8" font-weight="bold">LOG_ONLY:</tspan> Audit record</text>
  <text x="550" y="802" text-anchor="middle" fill="#94a3b8" font-size="11">Outbound: Tamper-evident Audit Log &amp; Re-identification Egress Layer</text>
</svg>